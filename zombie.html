<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Zombie Survivor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
:root {
    --bg-color: #0f172a;
    --neon-blue: #38bdf8;
    --neon-pink: #f472b6;
    --neon-green: #4ade80;
    --text-main: #f8fafc;
    --glass-bg: rgba(15, 23, 42, 0.6);
    --glass-border: rgba(255, 255, 255, 0.1);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
}

body {
    background-color: var(--bg-color);
    color: var(--text-main);
    font-family: 'Outfit', sans-serif;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    touch-action: none; /* Prevent browser scrolling/zooming */
    position: fixed;
    overscroll-behavior: none;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

/* --- HUD --- */
#hud {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 20px;
}

.top-bar {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.stats {
    display: flex;
    justify-content: space-between;
    font-size: 1.2rem;
    font-weight: 700;
    text-shadow: 0 0 10px var(--neon-blue);
}

.health-bar-container {
    width: 200px;
    height: 15px;
    background: rgba(0, 0, 0, 0.7); /* Semi-transparent black */
    border-radius: 10px;
    border: 2px solid lightgray; /* Silver border for clear outline */
    box-shadow: 0 0 5px rgba(0, 0, 0, 0.5); /* separation */
    overflow: hidden;
}

#health-bar {
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, #ef4444, #f87171);
    box-shadow: 0 0 10px #ef4444;
    transition: width 0.2s ease-out;
}

.exp-bar-container {
    width: 100%;
    height: 20px;
    background: rgba(0,0,0,0.5);
    border-radius: 10px;
    border: 1px solid var(--glass-border);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 10px; 
}

.ult-bar-container {
    width: 100%;
    height: 25px;
    background: rgba(0,0,0,0.5);
    border-radius: 12px;
    border: 2px solid var(--neon-pink);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 10px rgba(2ec4b6, 0.2);
}

.bottom-bar {
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 80px; /* Leave space for joystick */
    width: 100%;
}

.ult-btn {
    pointer-events: auto;
    padding: 12px 20px;
    background: rgba(255, 0, 127, 0.2);
    border: 2px solid var(--neon-pink);
    border-radius: 20px;
    color: rgba(255, 255, 255, 0.4);
    font-weight: bold;
    font-size: 1.0rem;
    font-family: inherit;
    white-space: nowrap;
    transition: all 0.3s ease;
}

.ult-btn.ult-ready {
    background: linear-gradient(45deg, #ff007f, var(--neon-pink));
    color: white;
    box-shadow: 0 0 20px var(--neon-pink);
    cursor: pointer;
    animation: ultPulse 1s infinite alternate;
}

.ult-btn.ult-ready:active {
    transform: scale(0.95);
}

.inv-btn {
    pointer-events: auto;
    padding: 12px 20px;
    background: rgba(59, 130, 246, 0.2);
    border: 2px solid var(--neon-blue);
    border-radius: 20px;
    color: white;
    font-weight: bold;
    font-size: 1.0rem;
    box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
}

.inv-btn:active {
    transform: scale(0.95);
}

#ult-bar {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #ff007f, var(--neon-pink));
    border-radius: 10px;
    box-shadow: 0 0 15px var(--neon-pink);
    transition: width 0.3s ease-out;
    z-index: 1;
}

#ult-text {
    position: relative;
    z-index: 2;
    font-weight: 900;
    font-size: 0.9rem;
    text-shadow: 0 0 5px #000;
    color: #fff;
    opacity: 0.8;
}

.ult-ready #ult-bar {
    animation: ultPulse 1s infinite alternate;
}
.ult-ready #ult-text {
    opacity: 1;
    color: #fff;
    text-shadow: 0 0 10px #fff;
    animation: ultTextPulse 0.5s infinite alternate;
}

@keyframes ultPulse {
    0% { filter: brightness(1); box-shadow: 0 0 15px var(--neon-pink); }
    100% { filter: brightness(1.5); box-shadow: 0 0 30px var(--neon-pink), 0 0 10px #fff; }
}

@keyframes ultTextPulse {
    0% { transform: scale(1); }
    100% { transform: scale(1.1); }
}

#exp-bar {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #3b82f6, var(--neon-blue));
    border-radius: 10px;
    box-shadow: 0 0 10px var(--neon-blue);
    transition: width 0.3s ease-out;
    z-index: 1;
}

#levelDisplay {
    position: relative;
    z-index: 2;
    font-weight: 900;
    font-size: 0.9rem;
    text-shadow: 0 0 5px #000;
}

/* --- Joystick --- */
#joystick-zone {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: auto; /* Allow touch */
    touch-action: none; /* Prevent browser scrolling from canceling pointer events */
}

#joystick-base {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 120px;
    height: 120px;
    background: rgba(255, 255, 255, 0.1);
    border: 2px solid rgba(255, 255, 255, 0.2);
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    backdrop-filter: blur(5px);
    display: none; /* Shown dynamically by JS or always shown */
}

#joystick-stick {
    width: 50px;
    height: 50px;
    background: rgba(255, 255, 255, 0.5);
    border-radius: 50%;
    box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
    position: absolute;
    pointer-events: none;
}

/* --- Overlays & Glassmorphism --- */
.overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(8px);
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    /* 사라질 때는 즉시(0.05초) 사라지도록 변경 */
    transition: opacity 0.05s ease, visibility 0s 0.05s;
    z-index: 100;
}

.overlay.active {
    opacity: 1;
    visibility: visible;
    pointer-events: none; /* Let touches pass through to joystick */
    transition: opacity 0.3s ease, visibility 0s 0s;
}

/* Allow interaction with UI elements */
.overlay.active .glass-panel,
.overlay.active .upgrade-card,
.overlay.active .btn {
    pointer-events: auto;
}

.glass-panel {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    padding: 40px;
    text-align: center;
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    transform: translateY(20px);
    transition: transform 0.1s ease; /* 사라질 때 즉시 사라지게 */
}

.overlay.active .glass-panel {
    transform: translateY(0);
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* 나타날 때만 튕기는 애니메이션 */
}

.glass-panel.wide {
    width: 90%;
    max-width: 700px;
}

h1 {
    font-size: 3rem;
    line-height: 1.1;
    margin-bottom: 10px;
}

.highlight {
    color: var(--neon-pink);
    text-shadow: 0 0 15px var(--neon-pink);
}

h2 {
    font-size: 2rem;
    color: var(--neon-blue);
    text-shadow: 0 0 10px var(--neon-blue);
}

/* --- Buttons --- */
.btn {
    background: linear-gradient(135deg, var(--neon-blue), #2563eb);
    color: white;
    border: none;
    padding: 15px 40px;
    font-size: 1.2rem;
    font-weight: 700;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
    transition: all 0.2s;
    font-family: inherit;
    margin-top: 10px;
}

.btn:active {
    transform: scale(0.95);
    box-shadow: 0 2px 10px rgba(56, 189, 248, 0.4);
}

/* --- Upgrade Cards --- */
.upgrade-cards {
    display: flex;
    flex-direction: row;
    gap: 15px;
    width: 100%;
    justify-content: center;
    flex-wrap: wrap; /* for mobile */
    max-height: 50vh;
    overflow-y: auto;
    padding: 10px;
}

.upgrade-card {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--glass-border);
    border-radius: 15px;
    padding: 20px;
    flex: 1;
    min-width: 140px;
    cursor: pointer;
    transition: all 0.3s;
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: center;
    position: relative;
    z-index: 101;
    pointer-events: auto !important;
}

.upgrade-card:hover, .upgrade-card:active {
    background: rgba(255, 255, 255, 0.1);
    border-color: var(--neon-green);
    transform: translateY(-5px);
    box-shadow: 0 5px 15px rgba(74, 222, 128, 0.2);
}

.card-icon {
    font-size: 2rem;
}

.card-title {
    font-weight: 700;
    color: var(--neon-green);
}

.card-desc {
    font-size: 0.9rem;
    color: #cbd5e1;
}

/* Animations */
@keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-10px); }
    100% { transform: translateY(0px); }
}

@media (max-width: 600px) {
    .glass-panel {
        padding: 20px 10px;
        gap: 10px;
    }
    .glass-panel.wide {
        width: 95%;
    }
    .upgrade-cards {
        max-height: 65vh;
        gap: 10px;
        flex-direction: column; /* Force vertical scroll on mobile for cards */
        flex-wrap: nowrap;
    }
    .upgrade-card {
        padding: 15px;
        min-width: 100%; /* Take full width of container */
        flex-direction: row; /* Horizontal layout for icon and text */
        text-align: left;
    }
    .card-icon {
        font-size: 2rem;
        margin-right: 15px;
    }
    .card-title {
        font-size: 1.1rem;
        margin-bottom: 5px;
    }
    .card-desc {
        font-size: 0.85rem;
    }
    h2 {
        font-size: 1.5rem;
        margin: 0;
    }
    .glass-panel p {
        margin: 0;
        font-size: 0.9rem;
    }
}

.inventory-container {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 50vh;
    overflow-y: auto;
    text-align: left;
    margin-top: 15px;
}

.inventory-item {
    display: flex;
    align-items: center;
    background: rgba(0,0,0,0.5);
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--glass-border);
}

.inventory-item .icon {
    font-size: 2rem;
    margin-right: 15px;
}

.inventory-item .info h3 {
    margin: 0 0 5px 0;
    font-size: 1.1rem;
}

.inventory-item .info p {
    margin: 0;
    font-size: 0.85rem;
    color: #ccc;
    white-space: pre-wrap;
    line-height: 1.4;
}

</style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <!-- Virtual Joystick Zone (Bottom Left) -->
    <div id="joystick-zone">
        <div id="joystick-base">

    </div>

    <!-- HUD Overlay -->
    <div id="hud">
        <div class="top-bar">
            <div class="stats">
                <span id="scoreDisplay">Score: 0</span>
                <span id="waveDisplay">Wave: 1</span>

            <div class="health-bar-container">
                <div id="health-bar"></div>

            <div class="exp-bar-container">
                <div id="exp-bar"></div>
                <span id="levelDisplay">Lv. 1</span>
            </div>
        </div>
        <div class="bottom-bar">
            <div class="ult-bar-container" id="ultContainer">
                <div id="ult-bar"></div>
                <span id="ult-text">ULTIMATE READY</span>
            </div>
            <div style="display: flex; gap: 10px;">
                <button id="mobileUltBtn" class="ult-btn">⚡ 궁극기</button>
                <button id="inventoryBtn" class="inv-btn">보유</button>
            </div>
        </div>
    </div>

    <!-- Main Menu Overlay -->
    <div id="menu-overlay" class="overlay active">

            <button id="startBtn" class="btn">GAME START</button>
            <button id="testStartBtn" class="btn" style="margin-top: 15px; background: rgba(139, 92, 246, 0.3); border-color: #8b5cf6;">TEST MODE</button>
        </div>
    </div>

    <!-- Upgrade Overlay -->
    <div id="upgrade-overlay" class="overlay">

                <!-- Cards injected by JS -->

                <!-- Injected via JS -->

            <p id="finalWaveDisplay">Wave: 1</p>
            <button id="restartBtn" class="btn">메인으로</button>
        </div>
    </div>

    <script>
class Joystick {
    constructor(zoneId, baseId, stickId) {
        this.zone = document.getElementById(zoneId);
        this.base = document.getElementById(baseId);
        this.stick = document.getElementById(stickId);
        
        this.active = false;
        this.touchId = null;
        this.origin = { x: 0, y: 0 };
        this.position = { x: 0, y: 0 };
        this.value = { x: 0, y: 0 };
        this.maxRadius = 60;

        this.initEvents();
    }

    initEvents() {
        // Use global touch events to prevent ANY hijacking or cancellation
        document.addEventListener('touchstart', this.handleStart.bind(this), {passive: false});
        document.addEventListener('touchmove', this.handleMove.bind(this), {passive: false});
        document.addEventListener('touchend', this.handleEnd.bind(this), {passive: false});
        document.addEventListener('touchcancel', this.handleEnd.bind(this), {passive: false});
    }

    isUIElement(target) {
        if (!target) return false;
        if (target.classList) {
            if (target.classList.contains('btn')) return true;
            if (target.classList.contains('upgrade-card')) return true;
            if (target.classList.contains('overlay')) return true;
            if (target.classList.contains('glass-panel')) return true;
        }
        if (target.closest) {
            if (target.closest('.btn')) return true;
            if (target.closest('.upgrade-card')) return true;
            if (target.closest('.overlay')) return true;
            if (target.closest('.glass-panel')) return true;
        }
        return false;
    }

    handleStart(e) {
        // ALWAYS prevent default to stop scrolling/zooming, EXCEPT on UI elements
        if (this.isUIElement(e.target)) return; // Let UI handle its own clicks
        
        if (e.cancelable) {
            try { e.preventDefault(); } catch(err) {}
        }

        if (this.active) return; // Ignore if already tracking a touch
        if (e.changedTouches.length === 0) return;
        
        this.active = true;
        let touch = e.changedTouches[0];
        this.touchId = touch.identifier;
        
        const clientX = touch.clientX;
        const clientY = touch.clientY;
        
        this.origin = { x: clientX, y: clientY };
        
        const zoneRect = this.zone.getBoundingClientRect();
        let baseX = clientX - zoneRect.left;
        let baseY = clientY - zoneRect.top;
        
        this.base.style.left = `${baseX - 60}px`;
        this.base.style.top = `${baseY - 60}px`;
        this.base.style.display = 'flex';
        this.stick.style.transform = `translate(0px, 0px)`;
        this.value = { x: 0, y: 0 };
    }

    handleMove(e) {
        // Prevent scrolling globally for any moving touch
        if (e.cancelable && !this.isUIElement(e.target)) {
            try { e.preventDefault(); } catch(err) {}
        }

        if (!this.active) {
            // Late-activation: If the game is running but joystick isn't active,
            // we take over the touch and spawn the joystick.
            if (typeof window.isPaused !== 'undefined' && window.isPaused) return;
            if (e.changedTouches.length === 0) return;
            
            this.active = true;
            let initTouch = e.changedTouches[0];
            this.touchId = initTouch.identifier;
            this.origin = { x: initTouch.clientX, y: initTouch.clientY };
            
            const zRect = this.zone.getBoundingClientRect();
            this.base.style.left = `${initTouch.clientX - zRect.left - 60}px`;
            this.base.style.top = `${initTouch.clientY - zRect.top - 60}px`;
            this.base.style.display = 'flex';
            this.stick.style.transform = `translate(0px, 0px)`;
            this.value = { x: 0, y: 0 };
            return;
        }
        
        // Find our tracked touch
        let touch = null;
        for (let i = 0; i < e.changedTouches.length; i++) {
            if (e.changedTouches[i].identifier === this.touchId) {
                touch = e.changedTouches[i];
                break;
            }
        }
        if (!touch) return;
        
        const clientX = touch.clientX;
        const clientY = touch.clientY;
        
        let dx = clientX - this.origin.x;
        let dy = clientY - this.origin.y;
        
        let distance = Math.hypot(dx, dy);
        
        if (distance > this.maxRadius) {
            dx = (dx / distance) * this.maxRadius;
            dy = (dy / distance) * this.maxRadius;
        }
        
        this.position = { x: dx, y: dy };
        
        // Normalize value vector so speed is constant regardless of drag distance
        if (distance > 0) {
            this.value = {
                x: dx / Math.min(distance, this.maxRadius),
                y: dy / Math.min(distance, this.maxRadius)
            };
        } else {
            this.value = { x: 0, y: 0 };
        }
        
        this.stick.style.transform = `translate(${dx}px, ${dy}px)`;
    }

    handleEnd(e) {
        if (!this.active) return;
        
        // Check if our tracked touch ended
        let ended = false;
        for (let i = 0; i < e.changedTouches.length; i++) {
            if (e.changedTouches[i].identifier === this.touchId) {
                ended = true;
                break;
            }
        }
        if (!ended) {
            // Fallback: if no fingers are on screen, force reset
            if (e.touches.length === 0) this.reset();
            return;
        }

        this.reset();
    }

    reset() {
        this.active = false;
        this.touchId = null;
        this.base.style.display = 'none';
        this.stick.style.transform = `translate(0px, 0px)`;
        this.value = { x: 0, y: 0 };
    }
}

</script>
    <script>
// entities.js

class Player {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = 10; // Reduced from 15
        this.color = '#38bdf8';
        this.speed = 2.0;
        
        // Stats
        this.maxHp = 100;
        this.hp = this.maxHp;
        this.damage = 10;
        this.attackSpeed = 1000; // ms between shots
        this.multiShot = 1; // number of bullets per shot
        
        // New RPG Stats
        this.pickupRange = 80;    // 경험치 자석 범위 (기본 80)
        this.bulletSize = 1.0;    // 투사체 크기 배율 (기본 1.0)
        this.critChance = 0.05;   // 치명타 확률 (기본 5%)
        this.critDamage = 2.0;    // 치명타 피해 배율 (기본 200%)
        this.duration = 1.0;      // 지속시간 배율 (기본 1.0)
        this.expBonus = 1.0;      // 경험치 획득량 배율 (기본 1.0)
        this.facingAngle = 0;
        
        this.lastShotTime = 0;
        this.hitTimer = 0;
        this.invincibilityTimer = 0; // 1초 무적 타이머
    }

    draw(ctx) {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        
        
        if (this.invincibilityTimer > 0) {
            // 깜박거림 효과 (100ms 간격으로 불투명도 변경)
            ctx.globalAlpha = Math.floor(this.invincibilityTimer / 100) % 2 === 0 ? 0.3 : 1.0;
        }

        if (this.hitTimer > 0) {
            ctx.fillStyle = 'red'; // Flash red
            this.hitTimer--;
        } else {
            ctx.fillStyle = this.color;
        }
        
        ctx.shadowBlur = 15;
        ctx.shadowColor = this.color;
        ctx.fill();
        ctx.closePath();
        ctx.shadowBlur = 0; // reset
        ctx.globalAlpha = 1.0; // reset alpha
        
        // Draw facing indicator
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(this.x + Math.cos(this.facingAngle) * (this.radius + 8), this.y + Math.sin(this.facingAngle) * (this.radius + 8));
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.stroke();
        ctx.closePath();
    }

    update(joystickValue, worldWidth, worldHeight, deltaTime = 16) {
        if (this.invincibilityTimer > 0) {
            this.invincibilityTimer -= deltaTime;
        }

        this.x += joystickValue.x * this.speed;
        this.y += joystickValue.y * this.speed;
        
        if (joystickValue.x !== 0 || joystickValue.y !== 0) {
            this.facingAngle = Math.atan2(joystickValue.y, joystickValue.x);
        }

        // Constrain to world bounds (Removed for infinite map)
        // if (this.x < this.radius) this.x = this.radius;
        // if (this.x > worldWidth - this.radius) this.x = worldWidth - this.radius;
        // if (this.y < this.radius) this.y = this.radius;
        // if (this.y > worldHeight - this.radius) this.y = worldHeight - this.radius;
    }
}

class Zombie {
    constructor(x, y, target, hpMulti = 1, speedMulti = 1, type = 'normal') {
        this.x = x;
        this.y = y;
        this.target = target;
        this.type = type;
        this.kbX = 0;
        this.kbY = 0;
        this.hitTimer = 0;
        
        this.statusEffects = {
            slow: 0,
            freeze: 0,
            burn: 0,
            burnTick: 0,
            armorBreak: 0
        };
        
        switch(type) {
            case 'fast':
                this.radius = 10;
                this.color = '#f59e0b'; // orange
                this.speed = (Math.random() * 0.4 + 0.8) * speedMulti;
                this.maxHp = 5 * hpMulti;
                break;
            case 'tank':
                this.radius = 18;
                this.color = '#166534'; // dark green
                this.speed = (Math.random() * 0.2 + 0.15) * speedMulti;
                this.maxHp = 100 * hpMulti;
                break;
            case 'ranged':
                this.radius = 12;
                this.color = '#7e22ce'; // purple
                this.speed = (Math.random() * 0.3 + 0.3) * speedMulti;
                this.maxHp = 20 * hpMulti;
                this.lastShotTime = 0;
                break;
            case 'bomb':
                this.radius = 14;
                this.color = '#f97316'; // orange
                this.speed = (Math.random() * 0.2 + 0.4) * speedMulti;
                this.maxHp = 30 * hpMulti;
                this.bombState = 'normal'; // 'normal', 'exploding'
                this.bombTimer = 0;
                break;
            case 'charger':
                this.radius = 13;
                this.color = '#3b82f6'; // blue
                this.speed = (Math.random() * 0.1 + 0.2) * speedMulti; // slow walk
                this.maxHp = 40 * hpMulti;
                this.chargeState = 'walk'; // walk, aim, dash
                this.chargeTimer = 0;
                this.chargeAngle = 0;
                break;
            case 'split':
                this.radius = 16;
                this.color = '#84cc16'; // slime green
                this.speed = (Math.random() * 0.2 + 0.3) * speedMulti;
                this.maxHp = 25 * hpMulti;
                break;
            default: // normal
                this.radius = 12;
                this.color = '#ef4444';
                this.speed = (Math.random() * 0.4 + 0.3) * speedMulti;
                this.maxHp = 20 * hpMulti;
                break;
        }
        this.hp = this.maxHp;
    }

    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        
        // Handle rotation for some shapes
        let angle = 0;
        if (this.type !== 'normal' && this.type !== 'tank' && this.type !== 'split') {
            angle = Math.atan2(this.target.y - this.y, this.target.x - this.x);
            ctx.rotate(angle);
        }

        ctx.beginPath();
        if (this.type === 'normal') {
            ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        } else if (this.type === 'fast') {
            ctx.moveTo(this.radius, 0);
            ctx.lineTo(-this.radius, this.radius * 0.8);
            ctx.lineTo(-this.radius, -this.radius * 0.8);
        } else if (this.type === 'tank') {
            ctx.rect(-this.radius, -this.radius, this.radius * 2, this.radius * 2);
        } else if (this.type === 'ranged') {
            ctx.moveTo(this.radius, 0);
            ctx.lineTo(0, this.radius);
            ctx.lineTo(-this.radius, 0);
            ctx.lineTo(0, -this.radius);
        } else if (this.type === 'bomb') {
            let spikes = 8;
            let timePulse = Math.sin(Date.now() / 100);
            let outerRadius = this.radius + (this.bombState === 'exploding' ? timePulse * 5 : 0);
            for(let i=0; i<spikes*2; i++) {
                let r = (i%2==0) ? outerRadius : outerRadius*0.6;
                let a = (Math.PI / spikes) * i;
                ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
            }
        } else if (this.type === 'charger') {
            ctx.moveTo(this.radius, 0);
            ctx.lineTo(this.radius * 0.3, this.radius);
            ctx.lineTo(-this.radius, this.radius * 0.8);
            ctx.lineTo(-this.radius, -this.radius * 0.8);
            ctx.lineTo(this.radius * 0.3, -this.radius);
        } else if (this.type === 'split') {
            let r = this.radius * 0.7;
            ctx.arc(-this.radius * 0.4, 0, r, 0, Math.PI * 2);
            ctx.closePath();
            ctx.beginPath();
            ctx.arc(this.radius * 0.4, 0, r, 0, Math.PI * 2);
        } else {
            ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        }
        
        ctx.closePath();
        
        if (this.hitTimer > 0) {
            ctx.fillStyle = '#fff';
            this.hitTimer--;
        } else if (this.statusEffects.freeze > 0) {
            ctx.fillStyle = '#bae6fd'; // Ice color
        } else if (this.statusEffects.burn > 0) {
            ctx.fillStyle = (Math.floor(Date.now() / 100) % 2 === 0) ? '#f97316' : this.color; // Flashing fire
        } else if (this.statusEffects.armorBreak > 0) {
            ctx.fillStyle = '#bef264'; // Acid green indicator
        } else {
            ctx.fillStyle = this.color;
        }
        
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        ctx.fill();
        ctx.restore(); // reset translate and rotate
        ctx.globalAlpha = 1.0; // reset alpha
        
        // Charger warning line
        if (this.type === 'charger' && this.chargeState === 'aim') {
            ctx.beginPath();
            ctx.moveTo(this.x, this.y);
            ctx.lineTo(this.x + Math.cos(this.chargeAngle) * 500, this.y + Math.sin(this.chargeAngle) * 500);
            ctx.strokeStyle = `rgba(255, 0, 0, ${Math.abs(Math.sin(this.chargeTimer * 0.2))})`;
            ctx.lineWidth = 2;
            ctx.stroke();
        }
        
        // HP bar for zombie
        if (this.hp < this.maxHp) {
            ctx.fillStyle = 'rgba(255,0,0,0.5)';
            ctx.fillRect(this.x - 10, this.y - 20, 20, 3);
            ctx.fillStyle = '#4ade80';
            ctx.fillRect(this.x - 10, this.y - 20, 20 * (this.hp / this.maxHp), 3);
        }
    }

    update(deltaTime = 16) {
        // Status Effects
        if (this.statusEffects.burn > 0) {
            this.statusEffects.burn -= deltaTime;
            this.statusEffects.burnTick += deltaTime;
            if (this.statusEffects.burnTick > 500) { // Tick every 0.5s
                this.statusEffects.burnTick = 0;
                this.takeDamage(5, false); // Burn damage
            }
        }
        if (this.statusEffects.armorBreak > 0) this.statusEffects.armorBreak -= deltaTime;
        if (this.statusEffects.slow > 0) this.statusEffects.slow -= deltaTime;
        
        if (this.statusEffects.freeze > 0) {
            this.statusEffects.freeze -= deltaTime;
            return; // Cannot move or attack
        }

        if (this.type === 'bomb' && this.bombState === 'exploding') {
            this.bombTimer++;
            return;
        }

        if (this.type === 'charger') {
            if (this.chargeState === 'aim') {
                this.chargeTimer++;
                if (this.chargeTimer > 45) { // 0.75s warning
                    this.chargeState = 'dash';
                    this.chargeTimer = 0;
                }
                return;
            } else if (this.chargeState === 'dash') {
                this.x += Math.cos(this.chargeAngle) * 10;
                this.y += Math.sin(this.chargeAngle) * 10;
                this.chargeTimer++;
                if (this.chargeTimer > 30) {
                    this.chargeState = 'walk';
                    this.chargeTimer = 0;
                }
                return;
            }
        }

        // Apply knockback
        this.x += this.kbX;
        this.y += this.kbY;
        this.kbX *= 0.8; // Decay knockback
        this.kbY *= 0.8;

        // Normal movement
        const dx = this.target.x - this.x;
        const dy = this.target.y - this.y;
        const dist = Math.hypot(dx, dy);
        
        let moveSpeed = this.statusEffects.slow > 0 ? this.speed * 0.5 : this.speed;

        // Behavior
        if (this.type === 'ranged') {
            if (dist > 300) {
                // Move closer
                if (Math.abs(this.kbX) < 1 && Math.abs(this.kbY) < 1) {
                    this.x += (dx / dist) * moveSpeed;
                    this.y += (dy / dist) * moveSpeed;
                }
            } else if (dist < 200) {
                // Back away slightly if too close
                if (Math.abs(this.kbX) < 1 && Math.abs(this.kbY) < 1) {
                    this.x -= (dx / dist) * moveSpeed * 0.5;
                    this.y -= (dy / dist) * moveSpeed * 0.5;
                }
            }
            // Shooting handled in game loop
        } else if (this.type === 'charger' && this.chargeState === 'walk') {
            if (dist < 400 && Math.random() < 0.02) {
                this.chargeState = 'aim';
                this.chargeTimer = 0;
                this.chargeAngle = Math.atan2(dy, dx);
            } else if (dist > 0 && Math.abs(this.kbX) < 1 && Math.abs(this.kbY) < 1) {
                this.x += (dx / dist) * moveSpeed;
                this.y += (dy / dist) * moveSpeed;
            }
        } else {
            // Chase
            if (dist > 0 && Math.abs(this.kbX) < 1 && Math.abs(this.kbY) < 1) {
                this.x += (dx / dist) * moveSpeed;
                this.y += (dy / dist) * moveSpeed;
            }
        }
    }

    takeDamage(amount, isCrit = false) {
        if (this.statusEffects.armorBreak > 0) amount *= 1.2; // 20% extra damage

        if (this.type === 'bomb' && this.bombState === 'exploding') return;
        
        this.hp -= amount;
        this.hitTimer = 5;
        
        if (this.hp <= 0 && this.type === 'bomb' && this.bombState === 'normal') {
            this.hp = 1;
            this.bombState = 'exploding';
            this.bombTimer = 0;
            return;
        }
        // Spawn damage text logic will be handled in game.js, 
        // but we can spawn it directly here if we make damageTexts global.
        if (typeof damageTexts !== 'undefined') {
            damageTexts.push(new DamageText(this.x, this.y, amount, isCrit));
        }
    }
}

class BossZombie extends Zombie {
    constructor(x, y, target, hpMulti, speedMulti = 1.0) {
        super(x, y, target, hpMulti, 0.8 * speedMulti, 'boss'); // Bosses are slightly slower but scale
        this.radius = 40; // Huge
        this.color = '#7f1d1d'; // Dark red
        this.maxHp = 250 * hpMulti; // Massive HP (halved)
        this.hp = this.maxHp;
    }

    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.beginPath();
        // Octagon
        for(let i=0; i<8; i++) {
            let a = (Math.PI * 2 / 8) * i - Math.PI/8;
            ctx.lineTo(Math.cos(a)*this.radius, Math.sin(a)*this.radius);
        }
        ctx.closePath();
        
        ctx.fillStyle = this.color;
        ctx.fill();

        // Hit flash effect
        if (this.hitTimer > 0) {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.fill();
            this.hitTimer--;
        }
        ctx.restore(); // restore transform
        
        // Huge HP bar
        if (this.hp < this.maxHp) {
            ctx.fillStyle = 'rgba(255,0,0,0.5)';
            ctx.fillRect(this.x - 30, this.y - 50, 60, 8);
            ctx.fillStyle = '#facc15'; // Yellow boss HP
            ctx.fillRect(this.x - 30, this.y - 50, 60 * (this.hp / this.maxHp), 8);
        }
    }
}

class Bullet {
    constructor(x, y, dx, dy, damage, sizeMultiplier = 1.0) {

        this.y = y;
        this.startX = x;
        this.startY = y;
        this.dx = dx;
        this.dy = dy;
        this.damage = damage;
        this.speed = 10;
        this.radius = 4 * sizeMultiplier;
        this.color = '#fef08a';
        this.pierceCount = 1; // Default 1 (no pierce)
        this.hitZombies = new Set(); // To not hit same zombie twice
    }

    draw(ctx) {
        if (this.isRailgun) {
            ctx.beginPath();
            ctx.moveTo(this.startX, this.startY); // Start from firing position
            ctx.lineTo(this.x, this.y);
            ctx.strokeStyle = '#38bdf8'; // bright blue
            ctx.lineWidth = this.radius * 2;
            ctx.lineCap = 'round';
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#38bdf8';
            ctx.stroke();
            ctx.closePath();
            ctx.shadowBlur = 0;
        } else {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.shadowBlur = 10;
            ctx.shadowColor = this.color;
            ctx.fill();
            ctx.closePath();
            ctx.globalAlpha = 1.0;
        }
    }

    update() {
        this.x += this.dx * this.speed;
        this.y += this.dy * this.speed;
    }
}

class ExpGem {
    constructor(x, y, amount, type = 'normal') {
        this.x = x;
        this.y = y;
        this.amount = amount;
        if (type === 'boss') {
            this.radius = 12;
            this.color = '#facc15'; // yellow
        } else if (type === 'rare') {
            this.radius = 7;
            this.color = '#c084fc'; // purple
        } else {
            this.radius = 5;
            this.color = '#60a5fa'; // blue
        }
        
        // Hover animation
        this.baseY = y;
        this.time = Math.random() * Math.PI * 2;
        this.isMagnetized = false;
    }

    draw(ctx) {
        ctx.beginPath();
        ctx.moveTo(this.x, this.y - this.radius);
        ctx.lineTo(this.x + this.radius, this.y);
        ctx.lineTo(this.x, this.y + this.radius);
        ctx.lineTo(this.x - this.radius, this.y);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        ctx.fill();
        ctx.closePath();
        ctx.shadowBlur = 0;
    }

    update(player) {
        this.time += 0.1;
        this.y = this.baseY + Math.sin(this.time) * 3;

        // Magnet effect towards player if close
        const dx = player.x - this.x;
        const dy = player.y - this.y;
        const dist = Math.hypot(dx, dy);
        
        let pullRadius = player.pickupRange; // Use player stat
        if (this.isMagnetized) pullRadius = 99999;
        
        if (dist < pullRadius) {
            let speed = this.isMagnetized ? 25 : 5;
            this.x += (dx / dist) * speed;
            this.baseY += (dy / dist) * speed;
        }
    }
}

class FieldItem {
    constructor(x, y, type) {
        this.x = x;
        this.y = y;
        this.type = type; // 'heal' or 'magnet'
        this.radius = 15;
        this.time = Math.random() * Math.PI * 2;
        this.baseY = y;
    }

    draw(ctx) {
        this.time += 0.05;
        this.y = this.baseY + Math.sin(this.time) * 5;

        ctx.save();
        ctx.translate(this.x, this.y);
        
        if (this.type === 'heal') {
            // Draw health cross
            ctx.fillStyle = '#22c55e'; // Green
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#22c55e';
            ctx.fillRect(-8, -3, 16, 6);
            ctx.fillRect(-3, -8, 6, 16);
        } else if (this.type === 'magnet') {
            // Draw magnet (U shape)
            ctx.strokeStyle = '#ef4444'; // Red
            ctx.lineWidth = 4;
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#ef4444';
            ctx.beginPath();
            ctx.arc(0, -2, 6, 0, Math.PI, true);
            ctx.lineTo(-6, 6);
            ctx.moveTo(6, -2);
            ctx.lineTo(6, 6);
            ctx.stroke();
            
            ctx.fillStyle = '#e2e8f0'; // Silver tips
            ctx.fillRect(-8, 6, 4, 3);
            ctx.fillRect(4, 6, 4, 3);
        }
        
        ctx.restore();
    }
}

class DamageText {
    constructor(x, y, damage, isCrit) {
        this.x = x + (Math.random() * 20 - 10);
        this.y = y + (Math.random() * 20 - 10);
        this.damage = Math.floor(damage);
        this.isCrit = isCrit;
        this.life = 1.0;
        this.dy = -1.5; // float up
    }

    draw(ctx) {
        ctx.globalAlpha = this.life;
        ctx.font = this.isCrit ? "bold 20px Outfit" : "bold 14px Outfit";
        ctx.fillStyle = this.isCrit ? "#facc15" : "#ffffff";
        if (this.isCrit) {
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#ef4444";
        } else {
            ctx.shadowBlur = 2;
            ctx.shadowColor = "#000000";
        }
        ctx.fillText(this.damage, this.x, this.y);
        ctx.globalAlpha = 1.0;
        ctx.shadowBlur = 0;
    }

    update() {
        this.y += this.dy;
        this.life -= 0.02; // lasts ~50 frames
    }
}

class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 3;
        this.dx = Math.cos(angle) * speed;
        this.dy = Math.sin(angle) * speed;
        this.radius = Math.random() * 2 + 1;
        this.life = 1.0;
        this.decay = Math.random() * 0.05 + 0.02;
    }

    draw(ctx) {
        ctx.globalAlpha = this.life;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.closePath();
        ctx.globalAlpha = 1.0;
    }

    update(playerDuration = 1.0, deltaTime = 16) {
        this.x += this.dx;
        this.y += this.dy;
        this.life -= (this.decay / playerDuration) * (deltaTime / 16);
    }
}

class LaserBeam {
    constructor(x, y, targetX, targetY, damage, level) {
        this.x = x;
        this.y = y;
        // damage is already multiplied by laserMultiplier in game.js, no need to multiply by level here
        this.damage = damage;
        this.life = 1.0;
        this.width = 10 + (level * 5); // 5픽셀씩 증가
        this.color = '#38bdf8';
        
        let dx = targetX - x;
        let dy = targetY - y;
        let angle = Math.atan2(dy, dx);
        let dist = 1500; // Screen length piercing
        this.endX = x + Math.cos(angle) * dist;
        this.endY = y + Math.sin(angle) * dist;
        
        this.hitZombies = new Set();
        this.tickTimer = 0;
    }

    draw(ctx) {
        ctx.globalAlpha = this.life;
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(this.endX, this.endY);
        ctx.strokeStyle = this.color;
        ctx.lineWidth = this.width;
        ctx.shadowBlur = 20;
        ctx.shadowColor = this.color;
        ctx.stroke();
        ctx.closePath();
        ctx.globalAlpha = 1.0;
        ctx.shadowBlur = 0;
    }

    update(playerDuration = 1.0, deltaTime = 16) {
        this.life -= (0.0083 / playerDuration) * (deltaTime / 16); // lasts ~2.0s * duration at 60fps
        this.tickTimer += deltaTime;
        if (this.tickTimer > 500) {
            this.tickTimer = 0;
            this.hitZombies.clear(); // 0.5초마다 다단히트!
        }
    }
}

class Fairy {
    constructor(player, index = 0, total = 1) {
        this.player = player;
        this.angleOffset = (Math.PI * 2 / total) * index;
        this.angle = 0;
        this.dist = 50;
        this.radius = 8;
        this.color = '#f472b6'; // pink
        this.lastShotTime = 0;
        this.x = player.x;
        this.y = player.y;
    }

    draw(ctx) {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 15;
        ctx.shadowColor = this.color;
        ctx.fill();
        ctx.closePath();
        ctx.shadowBlur = 0;
    }

    update(timestamp, level) {
        this.angle += 0.02; // 천천히 돌도록
        this.x = this.player.x + Math.cos(this.angle + this.angleOffset) * this.dist;
        this.y = this.player.y + Math.sin(this.angle + this.angleOffset) * this.dist;
    }
}

class BladeSwipe {
    constructor(player, damage, level) {
        this.player = player;
        this.x = player.x;
        this.y = player.y;
        this.damage = damage * level;
        this.radius = 80 + (level * 20); // range
        this.life = 1.0;
        
        // Use player's facing direction instead of random
        this.angle = player.facingAngle;
        this.color = '#e2e8f0'; // silver
        this.hitZombies = new Set();
        this.critChance = 0.05;
        this.duration = 1.0;
        this.tickTimer = 0;
    }

    draw(ctx) {
        ctx.globalAlpha = this.life;
        ctx.beginPath();
        ctx.moveTo(this.player.x, this.player.y);
        ctx.arc(this.player.x, this.player.y, this.radius, this.angle - Math.PI/2, this.angle + Math.PI/2);
        ctx.lineTo(this.player.x, this.player.y);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.fill();
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.closePath();
        ctx.globalAlpha = 1.0;
    }

    update(playerDuration = 1.0, deltaTime = 16) {
        this.x = this.player.x;
        this.y = this.player.y;
        this.life -= (0.1 / playerDuration) * (deltaTime / 16);
        this.tickTimer += deltaTime;
        if (this.tickTimer > 200) { // 0.2초마다 다단히트 (블레이드는 짧게 지속되므로)
            this.tickTimer = 0;
            this.hitZombies.clear();
        }
    }
}

class Aura {

class EliteBossZombie {
    constructor(x, y, player, hpMulti, speedMulti = 1.0) {
        this.x = x;
        this.y = y;
        this.radius = 45;
        this.color = '#ff00ff'; // Magenta boss
        this.type = 'elite';
        
        this.maxHp = 3000 * hpMulti;
        this.hp = this.maxHp;
        this.speed = player.speed * 0.4 * speedMulti;
        this.player = player;
        
        this.state = 'walk'; // walk, dash_warn, dash, spray
        this.stateTimer = 0;
        
        // Dash variables
        this.dashTargetX = 0;
        this.dashTargetY = 0;
        this.dashAngle = 0;
        this.dashCount = 0;
        
        this.isBerserk = false;
        this.tick = 0;
        
        this.statusEffects = {
            slow: 0,
            freeze: 0,
            burn: 0,
            burnTick: 0,
            armorBreak: 0
        };
    }

    takeDamage(amount, isCrit) {
        if (this.statusEffects.armorBreak > 0) amount *= 1.2;
        this.hp -= amount;
        if (this.hp <= 0 && this.type !== 'dead') {
            this.hp = 0;
        }
    }

    update() {
        // Status Effects
        if (this.statusEffects.burn > 0) {
            this.statusEffects.burn -= 16;
            this.statusEffects.burnTick += 16;
            if (this.statusEffects.burnTick > 500) {
                this.statusEffects.burnTick = 0;
                this.takeDamage(5, false); // Burn damage
            }
        }
        if (this.statusEffects.armorBreak > 0) this.statusEffects.armorBreak -= 16;
        if (this.statusEffects.slow > 0) this.statusEffects.slow -= 16;
        
        if (this.statusEffects.freeze > 0) {
            this.statusEffects.freeze -= 16;
            return; // Cannot move or attack
        }
        
        this.tick++;
        this.isBerserk = (this.hp < this.maxHp * 0.5);
        let moveSpeed = this.statusEffects.slow > 0 ? this.speed * 0.5 : this.speed;
        let currentSpeed = this.isBerserk ? moveSpeed * 1.3 : moveSpeed;

        if (this.state === 'walk') {
            let angle = Math.atan2(this.player.y - this.y, this.player.x - this.x);
            this.x += Math.cos(angle) * currentSpeed;
            this.y += Math.sin(angle) * currentSpeed;
            
            this.stateTimer++;
            let walkDuration = this.isBerserk ? 100 : 180;
            if (this.stateTimer > walkDuration) {
                this.stateTimer = 0;
                let r = Math.random();
                if (r < 0.5) {
                    this.state = 'dash_warn';
                    this.dashCount = this.isBerserk ? 2 : 1;
                } else {
                    this.state = this.isBerserk ? 'danmaku' : 'spray';
                }
            }
        } else if (this.state === 'dash_warn') {
            this.stateTimer++;
            let warnDuration = this.isBerserk ? 30 : 60;
            if (this.stateTimer > warnDuration) {
                this.state = 'dash';
                this.stateTimer = 0;
                this.dashAngle = Math.atan2(this.player.y - this.y, this.player.x - this.x);
            }
        } else if (this.state === 'dash') {
            this.x += Math.cos(this.dashAngle) * currentSpeed * 6; // Fast dash
            this.y += Math.sin(this.dashAngle) * currentSpeed * 6;
            this.stateTimer++;
            if (this.stateTimer > 30) { // 0.5 sec dash
                this.dashCount--;
                if (this.dashCount > 0) {
                    this.state = 'dash_warn';
                    this.stateTimer = 0;
                } else {
                    this.state = 'walk';
                    this.stateTimer = 0;
                }
            }
        } else if (this.state === 'spray') {
            this.stateTimer++;
            if (this.stateTimer % 10 === 0) { // Shoot bullet every 10 frames
                if (typeof enemyProjectiles !== 'undefined') {
                    let angle = (this.stateTimer / 10) * (Math.PI / 4); // Spiral pattern
                    enemyProjectiles.push(new EnemyProjectile(this.x, this.y, Math.cos(angle), Math.sin(angle), 5, 20));
                }
            }
            if (this.stateTimer > 80) {
                this.state = 'walk';
                this.stateTimer = 0;
            }
        } else if (this.state === 'danmaku') {
            this.stateTimer++;
            if (this.stateTimer % 6 === 0) {
                if (typeof enemyProjectiles !== 'undefined') {
                    let baseAngle = Math.atan2(this.player.y - this.y, this.player.x - this.x);
                    let sweep = Math.sin(this.stateTimer * 0.1) * 1.5; // Sweep back and forth
                    for (let i = -2; i <= 2; i++) {
                        let angle = baseAngle + sweep + (i * 0.2);
                        enemyProjectiles.push(new EnemyProjectile(this.x, this.y, Math.cos(angle), Math.sin(angle), 6, 20));
                    }
                }
            }
            if (this.stateTimer > 180) {
                this.state = 'walk';
                this.stateTimer = 0;
            }
        }
    }

    draw(ctx) {
        if (this.isBerserk) {
            this.color = (Math.floor(this.tick / 10) % 2 === 0) ? '#ff0000' : '#ffaaaa';
        } else {
            this.color = '#ff00ff';
        }
        
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.beginPath();
        // Hexagram (6-pointed star)
        for(let i=0; i<12; i++) {
            let r = (i%2==0) ? this.radius : this.radius*0.6;
            let a = (Math.PI * 2 / 12) * i;
            ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
        }
        ctx.closePath();
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 30;
        ctx.shadowColor = this.color;
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.restore();
        
        // Draw HP bar
        ctx.fillStyle = 'black';
        ctx.fillRect(this.x - 30, this.y - this.radius - 15, 60, 6);
        ctx.fillStyle = 'red';
        ctx.fillRect(this.x - 30, this.y - this.radius - 15, 60 * (this.hp / this.maxHp), 6);
        
        // Draw Dash Warning Line
        if (this.state === 'dash_warn') {
            let angle = Math.atan2(this.player.y - this.y, this.player.x - this.x);
            ctx.beginPath();
            ctx.moveTo(this.x, this.y);
            ctx.lineTo(this.x + Math.cos(angle) * 800, this.y + Math.sin(angle) * 800);
            ctx.strokeStyle = `rgba(255, 0, 0, ${Math.abs(Math.sin(this.stateTimer * 0.2))})`;
            ctx.lineWidth = 4;
            ctx.stroke();
        }
    }
}

class TreasureChest {

class BlackHole {
    constructor(x, y, damage) {
        this.x = x;
        this.y = y;
        this.radius = 150;
        this.coreRadius = 20;
        this.damage = damage;
        this.lifeTimer = 180; // 3 seconds
        this.damageTick = 0;
        this.rotation = 0;
    }
    
    update(zombies) {
        this.lifeTimer--;
        this.rotation += 0.1;
        this.damageTick++;
        
        for (let i = 0; i < zombies.length; i++) {
            let z = zombies[i];
            let dist = Math.hypot(z.x - this.x, z.y - this.y);
            if (dist < this.radius) {
                // Suck in
                let angle = Math.atan2(this.y - z.y, this.x - z.x);
                z.x += Math.cos(angle) * 3;
                z.y += Math.sin(angle) * 3;
                
                // Damage if in core or ticking
                if (dist < this.coreRadius || this.damageTick >= 10) {
                    z.takeDamage(this.damage);
                }
            }
        }
        if (this.damageTick >= 10) this.damageTick = 0;
    }
    
    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        
        // Event horizon
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(139, 92, 246, 0.2)'; // purple tint
        ctx.fill();
        ctx.closePath();
        
        // Core
        ctx.beginPath();
        ctx.arc(0, 0, this.coreRadius + Math.random() * 5, 0, Math.PI * 2);
        ctx.fillStyle = '#000000';
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#a855f7';
        ctx.fill();
        ctx.closePath();
        ctx.restore();
    }
}

class MiniAura {
    constructor(x, y, damage, durationFrames) {
        this.x = x;
        this.y = y;
        this.radius = 60;
        this.color = 'rgba(132, 204, 22, 0.4)'; // toxic green
        this.damage = damage;
        this.timer = durationFrames;
        this.damageTick = 0;
    }
    
    update(zombies) {
        this.timer--;
        this.damageTick++;
        if (this.damageTick >= 15) { // 0.25s
            this.damageTick = 0;
            for (let i = 0; i < zombies.length; i++) {
                let z = zombies[i];
                if (Math.hypot(z.x - this.x, z.y - this.y) < this.radius + z.radius) {
                    z.takeDamage(this.damage);
                }
            }
        }
    }
    
    draw(ctx) {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.closePath();
    }
}
