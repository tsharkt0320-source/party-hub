function updateHUD() {
    scoreDisplay.innerText = `Score: ${score}`;
    waveDisplay.innerText = `Wave: ${wave}`;
    healthBar.style.width = `${Math.max(0, (player.hp / player.maxHp) * 100)}%`;
    expBar.style.width = `${(exp / maxExp) * 100}%`;
    levelDisplay.innerText = `Lv. ${level}`;

    const ultBar = document.getElementById('ult-bar');
    const ultText = document.getElementById('ult-text');
    if (ultBar && ultText) {
        let ultPercent = Math.min(100, (ultGauge / ultGaugeMax) * 100);
        ultBar.style.width = ultPercent + '%';
        if (ultGauge >= ultGaugeMax) {
            document.getElementById('ultContainer')?.classList.add('ult-ready');
            document.getElementById('mobileUltBtn')?.classList.add('ult-ready');
            ultText.innerText = "ULTIMATE READY";
        } else {
            document.getElementById('ultContainer')?.classList.remove('ult-ready');
            document.getElementById('mobileUltBtn')?.classList.remove('ult-ready');
            ultText.innerText = `ULTIMATE: ${Math.floor(ultPercent)}%`;
        }
    }
}

function triggerUltimate() {
    if (ultGauge < ultGaugeMax) return;
    ultGauge = 0;
    isUltimateActive = true;
    ultTimer = 3000;
    updateHUD();
    
    let viewWidth = width / CAMERA_ZOOM;
    let viewHeight = height / CAMERA_ZOOM;
    let camX = player.x - viewWidth / 2;
    let camY = player.y - viewHeight / 2;
    
    zombies.forEach(z => {
        if (z.x >= camX && z.x <= camX + viewWidth && z.y >= camY && z.y <= camY + viewHeight) {
            z.takeDamage(9999, true);
        }
    });
}

function handleTestStartBtn(e) {
    if (e.cancelable) e.preventDefault();
    if (isPlaying) return;
    
    let pw = prompt("테스트 모드 비밀번호를 입력하세요:");
    if (pw !== "2222") {
        alert("비밀번호가 틀렸습니다.");
        return;
    }
    
    startGame();
    isTestMode = true;
    level = 10;
    maxExp = 50 + (9 * 20);
    pendingLevelUps = 9;
}

document.getElementById('testStartBtn')?.addEventListener('click', handleTestStartBtn);
document.getElementById('testStartBtn')?.addEventListener('touchstart', handleTestStartBtn, {passive: false});

document.getElementById('ultContainer')?.addEventListener('click', triggerUltimate);
document.getElementById('ultContainer')?.addEventListener('touchstart', triggerUltimate, {passive: true});

document.getElementById('mobileUltBtn')?.addEventListener('click', triggerUltimate);
document.getElementById('mobileUltBtn')?.addEventListener('touchstart', (e) => {
    e.preventDefault();
    triggerUltimate();
}, {passive: false});

function spawnZombie(timestamp) {
    if (isSwarming || isEliteBossActive) {
        return;
    }

    let targetZombieCount = 20 + (wave * 10);
    let currentSpawnRate = Math.max(200, 1000 - (wave * 100));
    
    if (zombies.length < targetZombieCount * 0.5) {
        currentSpawnRate = 50; 
    } else if (zombies.length > targetZombieCount * 1.5) {
        currentSpawnRate = 2000;
    }

    if (timestamp - lastSpawnTime > currentSpawnRate) {
        lastSpawnTime = timestamp;
        let angle = Math.random() * Math.PI * 2;
        let viewWidth = width / CAMERA_ZOOM;
        let viewHeight = height / CAMERA_ZOOM;
        let spawnRadius = Math.max(viewWidth, viewHeight) / 1.5 + 50; 
        
        let x = player.x + Math.cos(angle) * spawnRadius;
        let y = player.y + Math.sin(angle) * spawnRadius;
        
        let hpMulti = 1 + ((wave - 1) * 0.1) + ((level - 1) * 0.2);
        let speedMulti = 1 + (wave * 0.05) + (level * 0.02);
        
        let type = 'normal';
        let roll = Math.random();
        
        if (roll < 0.1) type = 'fast';
        else if (roll < 0.2) type = 'tank';
        else if (wave >= 2 && roll < 0.25) type = 'ranged';
        else if (wave >= 3 && roll < 0.35) type = 'bomb';
        else if (wave >= 4 && roll < 0.45) type = 'charger';
        else if (wave >= 5 && roll < 0.55) type = 'split';
        
        zombies.push(new Zombie(x, y, player, hpMulti, speedMulti, type));
    }

    if ((wave === 1 || wave % 5 === 0) && !bossSpawnedForWave) {
        bossSpawnedForWave = true;
        let viewWidth = width / CAMERA_ZOOM;
        let viewHeight = height / CAMERA_ZOOM;
        let angle = Math.random() * Math.PI * 2;
        let spawnRadius = Math.max(viewWidth, viewHeight) / 1.5 + 100;
        let x = player.x + Math.cos(angle) * spawnRadius;
        let y = player.y + Math.sin(angle) * spawnRadius;
        
        let hpMulti = 1 + ((wave - 1) * 0.3) + ((level - 1) * 0.2);
        let speedMulti = 1 + (wave * 0.05) + (level * 0.02);
        zombies.push(new BossZombie(x, y, player, hpMulti, speedMulti));
    }
}

function createExplosion(x, y, color) {
    for (let i = 0; i < 15; i++) {
        particles.push(new Particle(x, y, color));
    }
}

function handleShooting(timestamp) {
    let currentAttackSpeed = player.attackSpeed;
    if (player.skills.evo_railgun) {
        currentAttackSpeed *= 1.8; // Make railgun fire slower
    }
    
    if (timestamp - player.lastShotTime > currentAttackSpeed) {
        player.lastShotTime = timestamp;
        
        let angle = player.facingAngle;
        let count = player.multiShot;
        let spread = 0.2;
        let startAngle = angle - (spread * (count - 1)) / 2;
        
        for (let i = 0; i < count; i++) {
            let a = startAngle + i * spread;
                if (player.skills.evo_railgun) {
                    let b = new Bullet(player.x, player.y, Math.cos(a), Math.sin(a), player.damage * 5, player.bulletSize);
                    b.isRailgun = true;
                    b.radius *= 3;
                    b.speed = 25;
                    b.pierceCount = 999;
                    bullets.push(b);
                } else {
                    let b = new Bullet(player.x, player.y, Math.cos(a), Math.sin(a), player.damage, player.bulletSize);
                    if (player.skills.pierce) b.pierceCount = 1 + player.skills.pierce;
                    if (player.skills.evo_corrosive) {
                        b.color = '#84cc16';
                        b.radius *= 1.2;
                    }
                    bullets.push(b);
                }
            }
        }
    }

function checkLevelUp() {
    if (exp >= maxExp) {
        exp -= maxExp;
        level++;
        maxExp = Math.floor(maxExp * 1.15);
        updateHUD();
        triggerLevelUp();
    }
}

function triggerLevelUp() {
    isPaused = true;
    upgradeCardsContainer.innerHTML = '';
    
    let availableUpgrades = UPGRADES.filter(upg => {
        if (upg.id === 'evo_storm_bringer') {
            return (isTestMode || (player.skills['pierce'] >= 5 && player.skills['bsize'] >= 5)) && !player.skills['evo_storm_bringer'];
        }
        if (upg.id === 'evo_glacier_slash') {
            return (isTestMode || (player.skills['blade'] >= 5 && player.skills['dur'] >= 5)) && !player.skills['evo_glacier_slash'];
        }
        if (upg.id === 'evo_omega') {
            return (isTestMode || (player.skills['laser'] >= 5 && player.skills['crit'] >= 5)) && !player.skills['evo_omega'];
        }
        if (upg.id === 'evo_dragon_fairy') {
            return (isTestMode || (player.skills['fairy'] >= 3 && player.skills['atkspd'] >= 5)) && !player.skills['evo_dragon_fairy'];
        }
        if (upg.id === 'evo_corrosive_domain') {
            return (isTestMode || (player.skills['multi'] >= 5 && player.skills['aura'] >= 5)) && !player.skills['evo_corrosive_domain'];
        }
        if (upg.maxLevel && (player.skills[upg.id] || 0) >= upg.maxLevel) return false;
        return true;
    });
    
    let transcendents = availableUpgrades.filter(u => u.id.startsWith('evo_'));
    let normals = availableUpgrades.filter(u => !u.id.startsWith('evo_'));
    normals.sort(() => 0.5 - Math.random());
    
    let combined = [...transcendents, ...normals];
    let selected = combined.slice(0, 4);
    
    selected.forEach(upg => {
        let card = document.createElement('div');
        card.className = 'upgrade-card';
        
        let currentLevel = player.skills[upg.id] || 0;
        let nextLevel = currentLevel + 1;
        
        let title = upg.name;
        if (currentLevel > 0) {
            title += ` (Lv.${currentLevel} → Lv.${nextLevel})`;
        } else {
            title += ` (신규 획득)`;
        }
        
        let descText = typeof upg.desc === 'function' ? upg.desc(player, currentLevel, nextLevel) : upg.desc;
        
        card.innerHTML = `
            <div class="card-icon">${upg.icon}</div>
            <div class="card-content">
                <div class="card-title">${title}</div>
                <div class="card-desc" style="white-space: pre-line;">${descText}</div>
            </div>
        `;
        let applied = false;
        let canClick = false;
        setTimeout(() => { canClick = true; }, 500);
        
        const handleCardClick = (e) => {
            if (e.cancelable) e.preventDefault();
            if (!canClick || applied) return;
            applied = true;
            applyUpgrade(upg.id);
        };
        card.addEventListener('click', handleCardClick);
        card.addEventListener('touchstart', handleCardClick, {passive: false});
        upgradeCardsContainer.appendChild(card);
    });
    
    upgradeOverlay.classList.add('active');
}

function applyUpgrade(id, bypassPause = false) {
    if (!isPaused && !bypassPause) return;
    
    player.skills[id] = (player.skills[id] || 0) + 1;
    
    switch (id) {
        case 'dmg': player.damage += 5; break;
        case 'spd': player.speed += 0.3; break;
        case 'atkspd': player.attackSpeed = Math.max(150, player.attackSpeed - 150); break;
        case 'multi': player.multiShot += 1; break;
        case 'pierce': break;
        case 'laser': break;
        case 'blade': break;
        case 'fairy': 
            fairies = [];
            for (let i = 0; i < player.skills.fairy; i++) {
                fairies.push(new Fairy(player, i, player.skills.fairy));
            }
            break;
        case 'aura':
            if (!auraObj) auraObj = new Aura(player);
            break;
        case 'pickup': player.pickupRange += 20; break;
        case 'bsize': player.bulletSize += 0.25; break;
        case 'crit': player.critChance += 0.05; break;
        case 'dur': player.duration += 0.2; break;
        case 'ebonus': player.expBonus += 0.15; break;
        case 'hp': 
            player.maxHp += 20; 
            player.hp = Math.min(player.maxHp, player.hp + 20); 
            break;
        case 'evo_storm_bringer': player.skills.evo_storm_bringer = 1; break;
        case 'evo_omega': player.skills.evo_omega = 1; break;
        case 'evo_glacier_slash': player.skills.evo_glacier_slash = 1; break;
        case 'evo_dragon_fairy': 
            player.skills.evo_dragon_fairy = 1; 
            // Dragon fairy class will be added later, for now we just change the state
            break;
        case 'evo_corrosive_domain': player.skills.evo_corrosive_domain = 1; break;
        default: break;
    }
    
    updateHUD();
    
    if (exp >= maxExp) {
        checkLevelUp();
    } else if (!bypassPause) {
        upgradeOverlay.classList.remove('active');
        monsterPauseTimer = 500;
        isPaused = false;
        lastTime = performance.now();
        requestAnimationFrame(gameLoop);
    }
}

function pointToLineDist(px, py, x1, y1, x2, y2) {
    let A = px - x1, B = py - y1, C = x2 - x1, D = y2 - y1;
    let dot = A * C + B * D;
    let len_sq = C * C + D * D;
    let param = -1;
    if (len_sq != 0) param = dot / len_sq;
    let xx, yy;
    if (param < 0) { xx = x1; yy = y1; }
    else if (param > 1) { xx = x2; yy = y2; }
    else { xx = x1 + param * C; yy = y1 + param * D; }
    return Math.hypot(px - xx, py - yy);
}

function checkCollisions() {
    if (player.skills.evo_omega) {
        if (!isOmegaSpinning) {
            omegaTimer += 16;
            if (omegaTimer > 2000) {
                omegaTimer -= 2000;
                isOmegaSpinning = true;
                omegaSpinAngle = 0;
                zombies.forEach(z => z.hitByOmega = false);
            }
        } else {
            let spinSpeed = 0.15;
            omegaSpinAngle += spinSpeed;
            omegaBaseAngle += spinSpeed;
            
            let p1X = player.x + Math.cos(omegaBaseAngle) * 2000;
            let p1Y = player.y + Math.sin(omegaBaseAngle) * 2000;
            let p2X = player.x + Math.cos(omegaBaseAngle + Math.PI) * 2000;
            let p2Y = player.y + Math.sin(omegaBaseAngle + Math.PI) * 2000;
            
            for (let j = zombies.length - 1; j >= 0; j--) {
                let z = zombies[j];
                let dist1 = pointToLineDist(z.x, z.y, player.x, player.y, p1X, p1Y);
                let dist2 = pointToLineDist(z.x, z.y, player.x, player.y, p2X, p2Y);
                
                if (dist1 < 30 + z.radius || dist2 < 30 + z.radius) {
                    if (!z.hitByOmega) {
                        z.hitByOmega = true;
                        z.takeDamage(player.damage * 10, true);
                    }
                } else {
                    z.hitByOmega = false;
                }
            }
            
            if (omegaSpinAngle >= Math.PI) {
                isOmegaSpinning = false;
            }
        }
    }

    for (let j = zombies.length - 1; j >= 0; j--) {
        let z = zombies[j];
        
        if (z.type === 'bomb' && z.bombState === 'exploding' && z.bombTimer > 60) {
            createExplosion(z.x, z.y, '#f97316');
            let distToPlayer = Math.hypot(player.x - z.x, player.y - z.y);
            if (distToPlayer < 150 && player.invincibilityTimer <= 0) {
                player.hp -= 50;
                player.invincibilityTimer = 1000;
                screenFlashAlpha = 0.8;
            }
            for (let k = 0; k < zombies.length; k++) {
                if (k !== j && Math.hypot(zombies[k].x - z.x, zombies[k].y - z.y) < 150) {
                    zombies[k].takeDamage(200);
                }
            }
            z.hp = 0;
            z.bombState = 'dead';
        }

        let pDist = Math.hypot(player.x - z.x, player.y - z.y);
        if (pDist < player.radius + z.radius) {
            if (player.invincibilityTimer <= 0) {
                player.hp -= (z.radius > 20 ? 45 : 15);
                player.invincibilityTimer = 1000;
                player.hitTimer = 10;
                screenFlashAlpha = 0.5;
                updateHUD();
                if (player.hp <= 0) gameOver();
            }
        }

        for (let s of bladeSwipes) {
            let sDist = Math.hypot(z.x - s.player.x, z.y - s.player.y);
            if (sDist < s.radius + z.radius && !s.hitZombies.has(z)) {
                let angle = Math.atan2(z.y - s.player.y, z.x - s.player.x);
                let angleDiff = Math.abs(angle - s.angle);
                if (angleDiff > Math.PI) angleDiff = 2 * Math.PI - angleDiff;
                if (angleDiff < Math.PI / 1.5) { 
                    s.hitZombies.add(z);
                    let isCrit = Math.random() < player.critChance;
                    let finalDamage = s.damage;
                    if (isCrit) finalDamage *= player.critDamage;
                    z.takeDamage(finalDamage, isCrit);
                    if (isCrit) damageTexts.push(new DamageText(z.x, z.y, finalDamage, true));
                }
            }
        }

        for (let l of laserBeams) {
            let lDist = pointToLineDist(z.x, z.y, l.x, l.y, l.endX, l.endY);
            if (lDist < l.width/2 + z.radius && !l.hitZombies.has(z)) {
                l.hitZombies.add(z);
                let isCrit = Math.random() < player.critChance;
                let finalDamage = l.damage;
                if (isCrit) finalDamage *= player.critDamage;
                z.takeDamage(finalDamage, isCrit);
                if (isCrit) damageTexts.push(new DamageText(z.x, z.y, finalDamage, true));
                createExplosion(z.x, z.y, l.color);
                
                // --- Laser (Light) Splash ---
                if (player.skills.laser >= 3) {
                    let splashRange = 80;
                    for (let z2 of zombies) {
                        if (z2 !== z && Math.hypot(z2.x - z.x, z2.y - z.y) < splashRange) {
                            z2.takeDamage(finalDamage * 0.3, false);
                        }
                    }
                    for (let p = 0; p < 5; p++) particles.push(new Particle(z.x, z.y, '#fef08a', 2)); 
                }
            }
        }

        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            let bDist = Math.hypot(b.x - z.x, b.y - z.y);
            if (bDist < b.radius + z.radius && !b.hitZombies.has(z)) {
                b.hitZombies.add(z);
                let isCrit = Math.random() < player.critChance;
                let finalDamage = b.damage;
                if (isCrit) finalDamage *= player.critDamage;
                z.takeDamage(finalDamage, isCrit);
                if (isCrit) damageTexts.push(new DamageText(z.x, z.y, finalDamage, true));
                createExplosion(b.x, b.y, b.color);
                
                // --- Fairy (Fire) ---
                if (b.isFairy && player.skills.fairy >= 3) {
                    z.statusEffects.burn = 3000;
                }
                
                // --- Glacier Slash (Ice Evo) ---
                if (b.isGlacier) {
                    z.statusEffects.freeze = 1000;
                }
                
                // --- Basic Attack (Lightning) ---
                if (!b.isFairy && !b.isGlacier && player.skills.pierce >= 3) {
                    let chainTargets = 1;
                    if (player.skills.evo_storm_bringer) chainTargets = 3;
                    let range = 150;
                    
                    let zapCount = 0;
                    for (let z2 of zombies) {
                        if (zapCount >= chainTargets) break;
                        if (z2 !== z && !b.hitZombies.has(z2) && Math.hypot(z2.x - z.x, z2.y - z.y) < range) {
                            b.hitZombies.add(z2);
                            z2.takeDamage(finalDamage * 0.5, false);
                            particles.push(new Particle(z.x, z.y, '#fef08a', 0));
                            particles.push(new Particle(z2.x, z2.y, '#fef08a', 0));
                            zapCount++;
                        }
                    }
                }
                
                b.damage *= 0.9;
                
                if (!b.isStormBringer) b.pierceCount--;
                if (b.pierceCount <= 0) {
                    bullets.splice(i, 1);
                }
            }
        }

        if (z.hp <= 0) {
            // --- Corrosive Domain (Aura Lv 5) ---
            if (player.skills.evo_corrosive_domain) {
                // Drop poison puddle (MiniAura)
                miniAuras.push(new MiniAura(z.x, z.y, player.damage * 2.0, 300)); // Lasts longer or more dmg
            }
            
            createExplosion(z.x, z.y, z.radius > 20 ? '#7f1d1d' : '#ef4444');
            let dropAmount = 20; // Default normal exp
            let type = 'normal';
            
            let isElite = z.type === 'elite'; // Final Boss
            let isWaveBoss = z.radius > 20 && !isElite; // Mid Boss
            
            if (isElite) {
                isEliteBossActive = false;
                fieldItems.push(new TreasureChest(z.x, z.y));
                // Final Boss drops the Level Up Chest
            } else if (isWaveBoss) {
                dropAmount = Math.floor(maxExp * 0.5); // Mid Boss gets 0.5 levels worth of EXP
                type = 'boss';
            } else if (z.type === 'split') {
                let z1 = new Zombie(z.x - 10, z.y, player, z.maxHp * 0.5 / 20, z.speed * 1.5, 'normal');
                z1.radius = 8;
                let z2 = new Zombie(z.x + 10, z.y, player, z.maxHp * 0.5 / 20, z.speed * 1.5, 'normal');
                z2.radius = 8;
                zombies.push(z1, z2);
            } else if (wave >= 5 && Math.random() < 0.3) {
                type = 'rare';
                dropAmount = 40;
            }
            expGems.push(new ExpGem(z.x, z.y, dropAmount, type));
            score += (isElite || isWaveBoss) ? 1000 : 100;
            zombies.splice(j, 1);
            
            if (ultGauge < ultGaugeMax) {
                ultGauge += (z.radius > 20 ? 10 : 2);
                if (ultGauge > ultGaugeMax) ultGauge = ultGaugeMax;
                updateHUD();
            }
        }
    }

    for (let i = expGems.length - 1; i >= 0; i--) {
        let gem = expGems[i];
        let dist = Math.hypot(player.x - gem.x, player.y - gem.y);
        if (dist < player.radius + 15) { 
            exp += Math.floor(gem.amount * player.expBonus);
            expGems.splice(i, 1);
            checkLevelUp();
            updateHUD();
        }
    }

    for (let i = fieldItems.length - 1; i >= 0; i--) {
        let item = fieldItems[i];
        let dist = Math.hypot(player.x - item.x, player.y - item.y);
        if (dist < player.radius + item.radius) {
            if (item.type === 'chest') {
                // Chest grants a full level up
                exp += maxExp;
                checkLevelUp();
            } else if (item.type === 'heal') {
                player.hp = Math.min(player.maxHp, player.hp + 50);
                updateHUD();
            } else if (item.type === 'magnet') {
                expGems.forEach(g => g.isMagnetized = true);
            }
            fieldItems.splice(i, 1);
        }
    }
    
    for (let i = enemyProjectiles.length - 1; i >= 0; i--) {
        let p = enemyProjectiles[i];
        let dist = Math.hypot(player.x - p.x, player.y - p.y);
        if (dist < player.radius + p.radius) {
            if (player.invincibilityTimer <= 0) {
                player.hp -= p.damage;
                player.invincibilityTimer = 1000;
                player.hitTimer = 10;
                screenFlashAlpha = 0.5;
                updateHUD();
                if (player.hp <= 0) gameOver();
            }
            enemyProjectiles.splice(i, 1);
        }
    }
}

let accumulator = 0;
let simulatedTimestamp = 0;

function updateGame(timestamp) {
    if (!lastTime) {
        lastTime = timestamp;
        simulatedTimestamp = timestamp;
    }
    let frameTime = timestamp - lastTime;
    lastTime = timestamp;
    
    if (frameTime > 250) frameTime = 250;
    
    accumulator += frameTime;
    
    const TIME_STEP = 16; // 60 FPS fixed step
    
    while (accumulator >= TIME_STEP) {
        simulatedTimestamp += TIME_STEP;
        stepGame(simulatedTimestamp, TIME_STEP);
        accumulator -= TIME_STEP;
    }
}

function stepGame(timestamp, deltaTime) {

    if (isUltimateActive) {
        ultTimer -= deltaTime;
        if (ultTimer <= 0) {
            isUltimateActive = false;
        }
    }
    
    totalElapsedGameTime += deltaTime;
    if (totalElapsedGameTime - lastEliteBossSpawn > 60000 && !isEliteBossActive) {
        lastEliteBossSpawn = totalElapsedGameTime;
        isEliteBossActive = true;
        
        zombies = [];
        let hpMulti = 1 + ((wave - 1) * 0.5) + ((level - 1) * 0.2);
        let speedMulti = 1 + (wave * 0.05) + (level * 0.02);
        zombies.push(new EliteBossZombie(player.x, player.y - 400, player, hpMulti, speedMulti));
        
        isSwarming = true;
        swarmWarningTimer = 3000;
        swarmCount = 0;
    }

    waveTimer += deltaTime;
    if (waveTimer > 20000) { 
        wave++;
        waveTimer = 0;
        spawnRate = Math.max(200, spawnRate - 100);
        if (wave % 5 !== 0) bossSpawnedForWave = false;
        
        if (wave % 3 === 0) {
            isSwarming = true;
            swarmWarningTimer = 3000;
            swarmCount = 30 + wave * 5;
        }
        
        updateHUD();
    }
    
    if (isSwarming) {
        if (swarmWarningTimer > 0) {
            swarmWarningTimer -= deltaTime;
        } else if (swarmCount > 0) {
            for(let i=0; i<3; i++) {
                if (swarmCount <= 0) break;
                swarmCount--;
                let side = wave % 4;
                let spawnX, spawnY;
                if (side === 0) { spawnX = player.x + (Math.random()-0.5)*800; spawnY = player.y - 600; }
                else if (side === 1) { spawnX = player.x + 600; spawnY = player.y + (Math.random()-0.5)*800; }
                else if (side === 2) { spawnX = player.x + (Math.random()-0.5)*800; spawnY = player.y + 600; }
                else { spawnX = player.x - 600; spawnY = player.y + (Math.random()-0.5)*800; }
                
                let hpMulti = 1 + ((wave - 1) * 0.1) + ((level - 1) * 0.2);
                let speedMulti = 1 + (wave * 0.05) + (level * 0.02);
                zombies.push(new Zombie(spawnX, spawnY, player, hpMulti, speedMulti, 'fast'));
            }
            if (swarmCount <= 0) {
                isSwarming = false;
            }
        }
    }

    let inputX = joystick.value.x;
    let inputY = joystick.value.y;
    
    if (keys.w || keys.ArrowUp) inputY -= 1;
    if (keys.s || keys.ArrowDown) inputY += 1;
    if (keys.a || keys.ArrowLeft) inputX -= 1;
    if (keys.d || keys.ArrowRight) inputX += 1;

    let inputDist = Math.hypot(inputX, inputY);
    if (inputDist > 1) {
        inputX /= inputDist;
        inputY /= inputDist;
    }

    player.update({x: inputX, y: inputY}, WORLD_WIDTH, WORLD_HEIGHT, deltaTime);
    handleShooting(timestamp);

    if (player.skills.laser > 0) {
        laserTimer += deltaTime;
        if (laserTimer > 3000) {
            laserTimer = 0;
            if (zombies.length > 0) {
                let closest = null;
                let minDist = Infinity;
                for (let i = 0; i < zombies.length; i++) {
                    let z = zombies[i];
                    let d = Math.hypot(z.x - player.x, z.y - player.y);
                    if (d < minDist) {
                        minDist = d;
                        closest = z;
                    }
                }
                if (closest) {
                    let laserMultiplier = 2 + player.skills.laser;
                    laserBeams.push(new LaserBeam(player.x, player.y, closest.x, closest.y, player.damage * laserMultiplier, player.skills.laser));
                }
            }
        }
    }
    
    if (player.skills.blade > 0) {
        bladeTimer += deltaTime;
        if (bladeTimer > 1000) {
            bladeTimer = 0;
            bladeSwipes.push(new BladeSwipe(player, player.damage * 1.5, player.skills.blade));
            if (player.skills.evo_glacier_slash) {
                let a = player.facingAngle;
                let b = new Bullet(player.x, player.y, Math.cos(a), Math.sin(a), player.damage * 5.0, 4.0);
                b.pierceCount = 999;
                b.color = '#bae6fd';
                b.isGlacier = true;
                b.speed = 15;
                bullets.push(b);
            }
        }
    }
    
    for (let i = miniAuras.length - 1; i >= 0; i--) {
        miniAuras[i].update(zombies);
        if (miniAuras[i].timer <= 0) {
            miniAuras.splice(i, 1);
        }
    }
    
    for (let i = blackHoles.length - 1; i >= 0; i--) {
        blackHoles[i].update(zombies);
        if (blackHoles[i].lifeTimer <= 0) {
            blackHoles.splice(i, 1);
        }
    }

    if (player.skills.fairy || player.skills.evo_dragon_fairy) {
        if (fairies.length === 0 && player.skills.evo_dragon_fairy) fairies = [new FairyQueen(player)];
        
        for (let f of fairies) {
            if (player.skills.evo_dragon_fairy) {
                f.update(timestamp);
                if (timestamp - f.lastShotTime > 1000) { // Dragon breaths every 1s
                    f.lastShotTime = timestamp;
                    // Find nearest enemy to breath fire
                    let nearest = null;
                    let minDist = Infinity;
                    for (let z of zombies) {
                        let dist = Math.hypot(z.x - f.x, z.y - f.y);
                        if (dist < minDist) {
                            minDist = dist;
                            nearest = z;
                        }
                    }
                    if (nearest) {
                        let a = Math.atan2(nearest.y - f.y, nearest.x - f.x);
                        // Shoot 5 piercing fireballs in a cone
                        for (let i = -2; i <= 2; i++) {
                            let spreadA = a + i * 0.15;
                            let b = new Bullet(f.x, f.y, Math.cos(spreadA), Math.sin(spreadA), player.damage * 3.0, 2.0);
                            b.pierceCount = 999;
                            b.color = '#f97316'; // orange fire
                            b.isFairy = true;
                            bullets.push(b);
                        }
                    }
                }
            } else {
                f.update(timestamp, player.skills.fairy);
                if (timestamp - f.lastShotTime > 500) {
                    f.lastShotTime = timestamp;
                    let nearest = null;
                    let minDist = Infinity;
                    for (let z of zombies) {
                        let dist = Math.hypot(z.x - f.x, z.y - f.y);
                        if (dist < minDist) {
                            minDist = dist;
                            nearest = z;
                        }
                    }
                    if (nearest) {
                        let a = Math.atan2(nearest.y - f.y, nearest.x - f.x);
                        let b = new Bullet(f.x, f.y, Math.cos(a), Math.sin(a), player.damage * 1.5, 1.0);
                        b.pierceCount = 999;
                        b.color = f.color;
                        bullets.push(b);
                    }
                }
            }
        }
    }
    
    if (player.skills.aura) {
        let auraRadius = 100 + player.skills.aura * 20;
        if (player.skills.evo_corrosive_domain) auraRadius *= 2.0; // Corrosive Domain doubles radius
        
        if (timestamp - lastAuraTick > 500) {
            lastAuraTick = timestamp;
            zombies.forEach(z => {
                if (Math.hypot(z.x - player.x, z.y - player.y) < auraRadius) {
                    let isCrit = Math.random() < player.critChance;
                    let finalDamage = player.damage * 0.3 * player.skills.aura;
                    if (isCrit) finalDamage *= player.critDamage;
                    z.takeDamage(finalDamage, isCrit);
                }
            });
        }
    }

    bullets.forEach((b, index) => {
        b.update();
        if (Math.hypot(b.x - player.x, b.y - player.y) > 2500) {
            bullets.splice(index, 1);
        }
    });
    
    if (monsterPauseTimer > 0) {
        monsterPauseTimer -= deltaTime;
    } else {
        for (let i = zombies.length - 1; i >= 0; i--) {
            let z = zombies[i];
            
            // Despawn zombies that are way too far to save performance
            if (Math.hypot(z.x - player.x, z.y - player.y) > 3000) {
                zombies.splice(i, 1);
                continue;
            }
            
            z.update();
            if (z.type === 'ranged') {
                z.lastShotTime += deltaTime;
                if (z.lastShotTime > 2000) {
                    let dist = Math.hypot(player.x - z.x, player.y - z.y);
                    if (dist < 400) {
                        z.lastShotTime = 0;
                        let angle = Math.atan2(player.y - z.y, player.x - z.x);
                        let projSpeed = 4 + (wave * 0.1);
                        let damage = (10 + wave * 2) / 2;
                        enemyProjectiles.push(new EnemyProjectile(z.x, z.y, Math.cos(angle), Math.sin(angle), projSpeed, damage));
                    }
                }
            }
        }
        spawnZombie(timestamp);
    }
    
    enemyProjectiles.forEach((p, index) => {
        p.update();
        if (Math.hypot(p.x - player.x, p.y - player.y) > 2500) {
            enemyProjectiles.splice(index, 1);
        }
    });

    for (let i = expGems.length - 1; i >= 0; i--) {
        let gem = expGems[i];
        if (Math.hypot(gem.x - player.x, gem.y - player.y) > 4000) {
            expGems.splice(i, 1);
            continue;
        }
        gem.update(player);
    }
    damageTexts.forEach((dt, index) => {
        dt.update();
        if (dt.life <= 0) damageTexts.splice(index, 1);
    });
    
    if (Math.random() < 0.0005) {
        let ix = player.x + (Math.random() - 0.5) * 3000;
        let iy = player.y + (Math.random() - 0.5) * 3000;
        let type = Math.random() > 0.5 ? 'heal' : 'magnet';
        fieldItems.push(new FieldItem(ix, iy, type));
    }

    particles.forEach((p, index) => {
        p.update();
        if (p.life <= 0) particles.splice(index, 1);
    });
    laserBeams.forEach((l, index) => {
        l.update(player.duration, deltaTime);
        if (l.life <= 0) laserBeams.splice(index, 1);
    });

    bladeSwipes.forEach((s, index) => {
        s.update(player.duration, deltaTime);
        if (s.life <= 0) bladeSwipes.splice(index, 1);
    });

    checkCollisions();
}

function drawGrid(cameraX, cameraY, viewWidth, viewHeight) {
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
    ctx.lineWidth = 2;
    const gridSize = 100;
    const startX = Math.floor(cameraX / gridSize) * gridSize;
    const startY = Math.floor(cameraY / gridSize) * gridSize;

    ctx.beginPath();
    for (let x = startX; x < cameraX + viewWidth; x += gridSize) {
        ctx.moveTo(x, cameraY);
        ctx.lineTo(x, cameraY + viewHeight);
    }
    for (let y = startY; y < cameraY + viewHeight; y += gridSize) {
        ctx.moveTo(cameraX, y);
        ctx.lineTo(cameraX + viewWidth, y);
    }
    ctx.stroke();
}

function drawGame() {
    ctx.clearRect(0, 0, width, height);
    ctx.save();
    
    ctx.scale(CAMERA_ZOOM, CAMERA_ZOOM);
    
    let viewWidth = width / CAMERA_ZOOM;
    let viewHeight = height / CAMERA_ZOOM;
    let cameraX = player.x - viewWidth / 2;
    let cameraY = player.y - viewHeight / 2;

    ctx.translate(-cameraX, -cameraY);
    drawGrid(cameraX, cameraY, viewWidth, viewHeight);

    if (player.skills.aura) {
        let a = new Aura(player);
        a.draw(ctx, player.skills.aura);
    }
    
    miniAuras.forEach(m => m.draw(ctx));
    blackHoles.forEach(b => b.draw(ctx));

    expGems.forEach(gem => gem.draw(ctx));
    fieldItems.forEach(item => item.draw(ctx));
    bullets.forEach(b => b.draw(ctx));
    laserBeams.forEach(l => l.draw(ctx));
    bladeSwipes.forEach(s => s.draw(ctx));
    zombies.forEach(z => z.draw(ctx));
    particles.forEach(p => p.draw(ctx));
    damageTexts.forEach(dt => dt.draw(ctx));

    fairies.forEach(f => f.draw(ctx));
    enemyProjectiles.forEach(p => p.draw(ctx));
    
    if (player.skills.evo_omega && isOmegaSpinning) {
        ctx.beginPath();
        let p1X = player.x + Math.cos(omegaBaseAngle) * 2000;
        let p1Y = player.y + Math.sin(omegaBaseAngle) * 2000;
        let p2X = player.x + Math.cos(omegaBaseAngle + Math.PI) * 2000;
        let p2Y = player.y + Math.sin(omegaBaseAngle + Math.PI) * 2000;
        
        ctx.moveTo(player.x, player.y);
        ctx.lineTo(p1X, p1Y);
        ctx.moveTo(player.x, player.y);
        ctx.lineTo(p2X, p2Y);
        
        ctx.strokeStyle = 'rgba(250, 204, 21, 0.6)';
        ctx.lineWidth = 60;
        ctx.stroke();
    }
    
    // Draw player LAST so it is always on top
    player.draw(ctx);

    ctx.restore(); 

    // Draw Swarm Warning (Screen Space)
    if (isSwarming && swarmWarningTimer > 0) {
        let alpha = Math.abs(Math.sin(performance.now() / 200));
        ctx.fillStyle = `rgba(255, 0, 0, ${alpha})`;
        ctx.font = 'bold 40px Outfit';
        ctx.textAlign = 'center';
        ctx.fillText("! WARNING !", width/2, height/4);
    }

    if (screenFlashAlpha > 0) {
        ctx.fillStyle = `rgba(255, 0, 0, ${screenFlashAlpha})`;
        ctx.fillRect(0, 0, width, height);
        screenFlashAlpha -= 0.05;
    }
    
    if (isUltimateActive) {
        let flashColor = Math.random() > 0.5 ? '255, 255, 255' : '56, 189, 248';
        ctx.fillStyle = `rgba(${flashColor}, 0.6)`;
        ctx.fillRect(0, 0, width, height);
        
        ctx.fillStyle = 'white';
        ctx.font = 'bold 100px Outfit';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText("OMEGA STRIKE", width/2, height/2);
    }
}

// New function for granting chest upgrades
function grantChestUpgrades() {
    let availableUpgrades = UPGRADES.filter(u => {
        if (u.maxLevel && (player.skills[u.id] || 0) >= u.maxLevel) return false;
        return true;
    });
    
    let shuffled = [...availableUpgrades].sort(() => 0.5 - Math.random());
    let granted = shuffled.slice(0, 3);
    
    granted.forEach(upg => {
        applyUpgrade(upg.id, true);
    });
    
    updateHUD();
    screenFlashAlpha = 0.8; // Flash screen to signify huge reward!
}

function gameLoop(timestamp) {
    if (!isPlaying || isPaused) return;
    
    if (pendingLevelUps > 0) {
        pendingLevelUps--;
        triggerLevelUp();
        return;
    }
    
    updateGame(timestamp);
    drawGame();
    animationId = requestAnimationFrame(gameLoop);
}

function startGame() {
    initGame();
    menuOverlay.classList.remove('active');
    gameoverOverlay.classList.remove('active');
    upgradeOverlay.classList.remove('active'); // Fix stuck skills
    isPlaying = true;
    isPaused = false;
    lastTime = performance.now();
    animationId = requestAnimationFrame(gameLoop);
}

function gameOver() {
    isPlaying = false;
    finalScoreDisplay.innerText = `Score: ${score}  |  Wave: ${wave}`;
    gameoverOverlay.classList.add('active');

    // 파티 허브 안에서 실행 중이면 기록을 부모 화면으로 보낸다.
    // 따로 열었을 때는 부모가 없으므로 아무 일도 일어나지 않는다.
    try {
        if (window.parent && window.parent !== window) {
            window.parent.postMessage(
                { type: 'zombie_score', score: score, wave: wave },
                window.location.origin
            );
        }
    } catch (e) { /* 무시 */ }
}

const inventoryBtn = document.getElementById('inventoryBtn');
const inventoryOverlay = document.getElementById('inventory-overlay');
const closeInventoryBtn = document.getElementById('closeInventoryBtn');
const inventoryContainer = document.getElementById('inventoryContainer');

inventoryBtn?.addEventListener('click', (e) => {
    if (e && e.cancelable) e.preventDefault();
    if (!isPlaying) return;
    isPaused = true;
    inventoryOverlay.classList.add('active');
    
    inventoryContainer.innerHTML = '';
    
    for (let key in player.skills) {
        let lv = player.skills[key];
        if (lv > 0) {
            let upg = UPGRADES.find(u => u.id === key);
            if (upg) {
                let div = document.createElement('div');
                div.className = 'inventory-item';
                let levelText = upg.maxLevel === 1 ? 'MAX' : `Lv. ${lv}`;
                div.innerHTML = `
                    <div class="icon">${upg.icon}</div>
                    <div class="info">
                        <h3>${upg.name} <span style="color:var(--neon-pink)">${levelText}</span></h3>
                        <p>${upg.desc(player, lv, lv).replace(/\n/g, '<br>')}</p>
                    </div>
                `;
                inventoryContainer.appendChild(div);
            }
        }
    }
});

inventoryBtn?.addEventListener('touchstart', (e) => {
    if (e && e.cancelable) e.preventDefault();
    inventoryBtn.click();
}, {passive: false});

closeInventoryBtn?.addEventListener('click', () => {
    inventoryOverlay.classList.remove('active');
    isPaused = false;
    lastTime = performance.now();
    requestAnimationFrame(gameLoop);
});

// Event Listeners
function handleStartBtn(e) {
    if (e.cancelable) e.preventDefault();
    if (isPlaying) return; // Prevent double trigger if already playing
    startGame();
}
function returnToMenu(e) {
    if (e && e.cancelable) e.preventDefault();
    gameoverOverlay.classList.remove('active');
    menuOverlay.classList.add('active');
}

startBtn.addEventListener('click', handleStartBtn);
startBtn.addEventListener('touchstart', handleStartBtn, {passive: false});
restartBtn.addEventListener('click', returnToMenu);
restartBtn.addEventListener('touchstart', returnToMenu, {passive: false});

window.addEventListener('contextmenu', e => e.preventDefault());

</script>
