<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <title>파티 허브</title>

    <!-- 홈 화면 앱(PWA) 설정 -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1e293b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="파티 허브">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="icon" href="/icons/icon-192.png">

    <link rel="stylesheet" href="style.css">
    
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, update, remove, get, child, onDisconnect, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        // 사용자 Firebase 설정
        const firebaseConfig = {
          apiKey: "AIzaSyBdXpecrHX8WvigjATX9HaMA4bqYe5IkUE",
          authDomain: "mt-game-1c5b2.firebaseapp.com",
          databaseURL: "https://mt-game-1c5b2-default-rtdb.firebaseio.com",
          projectId: "mt-game-1c5b2",
          storageBucket: "mt-game-1c5b2.firebasestorage.app",
          messagingSenderId: "41914825225",
          appId: "1:41914825225:web:15c6ef0b440abbaf1316d8"
        };

        // Initialize Firebase (Only if config is set)
        let app, db;
        if (firebaseConfig.apiKey) {
            app = initializeApp(firebaseConfig);
            db = getDatabase(app);
            window.db = db;
            window.firebaseRef = ref;
            window.firebaseSet = set;
            window.firebaseOnValue = onValue;
            window.firebaseUpdate = update;
            window.firebaseRemove = remove;
            window.firebaseGet = get;
            window.firebaseChild = child;
            window.firebaseOnDisconnect = onDisconnect;
            // 선착순 자리 선점에 쓴다 — 두 명이 동시에 눌러도 서버에서 한 명만 성공한다
            window.firebaseRunTransaction = runTransaction;

            // 익명 로그인 — 사용자는 아무것도 하지 않는다.
            // 페이지를 실제로 연 기기에만 출입증이 발급되므로,
            // DB 주소만 아는 외부인/스크립트는 접근이 차단된다.
            const auth = getAuth(app);
            window.auth = auth;
            window.authReady = new Promise((resolve) => {
                let done = false;
                const finish = (v) => { if (!done) { done = true; resolve(v); } };

                onAuthStateChanged(auth, (user) => { if (user) finish(user); });

                signInAnonymously(auth).catch((err) => {
                    console.error('익명 로그인 실패:', err && err.code, err);
                    window.authError = (err && err.code) || 'unknown';
                    finish(null);
                });

                // 네트워크가 느려도 앱이 영영 안 뜨는 일은 없도록
                setTimeout(() => finish(null), 8000);
            });
        } else {
            console.error("Firebase config is missing!");
        }
    </script>
</head>
<body>
    <div id="app">
        <!-- 홈 화면 -->
        <div id="screen-home" class="screen active">
            <h1>🎉 파티 허브 🎉</h1>
            <p style="font-size: 0.9rem; color: #666; margin-bottom: 30px;">친구들과 다양한 게임을 즐겨보세요</p>
            <div id="resume-box" style="display:none; margin-bottom:25px; padding:16px; border-radius:12px; background:rgba(74,222,128,0.12); border:1px solid #4ade80;">
                <p id="resume-text" style="color:#bbf7d0; font-size:0.9rem; margin-bottom:12px; line-height:1.5;"></p>
                <button id="btn-resume" class="btn primary" style="width:100%; padding:14px; background:#16a34a;">🔄 다시 들어가기</button>
                <button id="btn-resume-dismiss" class="btn secondary" style="width:100%; padding:10px; margin-top:8px; background:#374151; font-size:0.85rem;">아니요, 새로 시작할래요</button>
            </div>
            <div class="btn-group" style="flex-direction: column; gap: 15px;">
                <button id="nav-create" class="btn primary" style="padding: 20px; font-size: 1.2rem;">방 만들기</button>
                <button id="nav-join" class="btn secondary" style="padding: 20px; font-size: 1.2rem;">방 접속하기</button>
            </div>
            <!-- 홈 화면 앱으로 추가 안내 (설치 가능할 때만 표시) -->
            <div id="install-box" style="display:none; margin-top:22px;">
                <button id="btn-install" class="btn" style="width:100%; padding:13px; font-size:0.95rem; background:rgba(99,102,241,0.15); border:1px solid var(--primary); color:#c7d2fe;">
                    📲 홈 화면에 앱으로 추가
                </button>
                <p id="install-hint" style="display:none; margin-top:10px; font-size:0.82rem; color:#94a3b8; line-height:1.6; text-align:left; padding:12px; background:rgba(255,255,255,0.04); border-radius:10px;"></p>
            </div>

            <p style="margin-top:26px; font-size:0.75rem; color:#475569;">ver 2.9</p>
        </div>

        <!-- 방 만들기 화면 -->
        <div id="screen-create" class="screen">
            <button class="btn-float-back nav-back">◁</button>
            <h2>방 만들기</h2>
            <div class="input-group">
                <input type="text" id="create-nickname" placeholder="사용할 닉네임 입력" maxlength="8">
            </div>
            <button id="btn-create-room" class="btn primary" style="margin-top: 10px; width: 100%;">완료 및 생성</button>
            <div id="create-error" class="error-text"></div>
        </div>

        <!-- 방 접속 화면 -->
        <div id="screen-join" class="screen">
            <button class="btn-float-back nav-back">◁</button>
            <h2>방 접속하기</h2>
            <div id="invite-banner" style="display:none; margin-bottom:15px; padding:14px; border-radius:12px; background:rgba(59,130,246,0.12); border:1px solid #3b82f6; color:#dbeafe; font-size:0.95rem; line-height:1.5;"></div>
            <div class="input-group">
                <input type="text" id="join-nickname" placeholder="사용할 닉네임 입력" maxlength="8">
                <input type="number" id="join-roomcode" placeholder="방 코드 (숫자 4자리)" pattern="\d*" maxlength="4">
            </div>
            <button id="btn-join-room" class="btn primary" style="margin-top: 10px; width: 100%;">접속하기</button>
            <div id="join-error" class="error-text"></div>
        </div>

        <!-- 로비 화면 -->
        <div id="screen-lobby" class="screen">
            <button class="btn-float-back leave-room-btn">◁</button>
            <h2 id="lobby-room-code-display">방 코드: <span>----</span></h2>

            <!-- 초대 링크 -->
            <div id="invite-box" style="margin:10px 0; padding:15px; background:rgba(59,130,246,0.08); border-radius:12px; border:1px solid rgba(59,130,246,0.4);">
                <h4 style="color:#93c5fd; margin-bottom:10px; text-align:center;">🔗 친구 초대하기</h4>
                <div id="invite-url" style="font-size:0.8rem; color:#cbd5e1; background:rgba(0,0,0,0.25); padding:10px; border-radius:8px; word-break:break-all; text-align:center; margin-bottom:10px;"></div>
                <div style="display:flex; gap:8px;">
                    <button class="btn primary" style="flex:2; padding:12px; font-size:0.95rem;" onclick="window.shareInvite()">📤 링크 보내기</button>
                    <button class="btn secondary" style="flex:1; padding:12px; font-size:0.95rem; background:#4b5563;" onclick="window.copyInvite()">📋 복사</button>
                    <button class="btn secondary" style="flex:1; padding:12px; font-size:0.95rem; background:#4b5563;" onclick="window.toggleQr()">📱 QR</button>
                </div>
                <div id="qr-area" data-open="0" style="text-align:center; margin-top:12px;"></div>
                <div id="invite-toast" style="display:none; margin-top:10px; text-align:center; color:#4ade80; font-size:0.85rem;"></div>
            </div>

            <div id="team-picker-area" style="margin:10px 0; padding:15px; background:rgba(255,255,255,0.03); border-radius:12px; border:1px solid rgba(255,255,255,0.1);">
                <h4 style="color:#94a3b8; margin-bottom:10px; text-align:center;">⚔️ 팀 선택</h4>
            </div>

            <div class="players-container">
                <h3>접속한 플레이어 (<span id="player-count">0</span>명)</h3>
                <ul id="player-list"></ul>
            </div>
            
            <div id="host-controls" class="host-only">
                <h3 style="margin-bottom:8px;">게임 선택</h3>
                <p style="text-align:center; color:var(--text-muted); font-size:0.82rem; margin-bottom:4px;">방장만 고를 수 있습니다</p>
                <div class="game-selector">
                    <button class="btn game-btn" data-game="mafia">🕵️ 마피아 게임</button>
                    <button class="btn game-btn" data-game="liar">🤥 라이어 게임</button>
                    <button class="btn game-btn" data-game="quiz">🎉 단체 게임 모음집</button>
                    <button class="btn game-btn" data-game="minigames">🎲 복불복 미니게임</button>
                    <button class="btn game-btn" data-game="record">🏆 기록 게임</button>
                    <button class="btn game-btn" data-game="buzzer">🚨 부저만 사용</button>
                </div>

                <details class="host-tools">
                    <summary>👑 방장 도구</summary>
                    <div class="tool-body">
                        <label>👑 팀장 지정</label>
                        <select id="captain-select"></select>
                        <label style="margin-top:14px;">방장 권한 넘기기</label>
                        <select id="host-transfer-select"></select>
                    </div>
                </details>

                <!-- ===== 테스트용 봇 (임시 기능) =====
                     실제 서비스에서 뺄 때는 아래 div 하나와
                     app.js 의 addBot / removeBot 만 지우면 됩니다. -->
                <div id="test-bot-tools" class="test-tools">
                    <span class="tt-label">🤖 테스트 봇</span>
                    <button class="tt-btn" onclick="window.removeBot()" title="봇 1명 빼기">−</button>
                    <span class="tt-count" id="bot-count">0</span>
                    <button class="tt-btn" onclick="window.addBot()" title="봇 1명 추가">＋</button>
                </div>
                <!-- ===== 테스트용 봇 끝 ===== -->
            </div>
            <div id="guest-waiting" class="guest-only">
                <p>방장이 게임을 선택할 때까지 대기해 주세요...</p>
            </div>
        </div>

        <!-- 마피아 게임 화면 -->
        <div id="screen-mafia" class="screen">
            <button class="btn-float-back back-to-lobby host-only">◁</button>
            <h2>🕵️ 마피아 게임</h2>
            <div id="mafia-content"></div>
        </div>

        <!-- 라이어 게임 화면 -->
        <div id="screen-liar" class="screen">
            <button class="btn-float-back back-to-lobby host-only">◁</button>
            <h2>🤥 라이어 게임</h2>
            <div id="liar-content"></div>
        </div>

        <!-- 초성 퀴즈 화면 -->
        <div id="screen-quiz" class="screen">
            <button class="btn-float-back back-to-lobby host-only">◁</button>
            <h2>🎉 단체 게임 모음집</h2>
            <div id="quiz-content"></div>
        </div>
        <!-- 복불복 미니게임 화면 -->
        <div id="screen-minigames" class="screen">
            <button class="btn-float-back back-to-lobby host-only">◁</button>
            <h2>🎲 복불복 미니게임</h2>
            <div id="minigames-content"></div>
        </div>
        <!-- 기록 게임 화면 -->
        <div id="screen-record" class="screen">
            <button class="btn-float-back back-to-lobby host-only">◁</button>
            <h2>🏆 기록 게임</h2>
            <div id="record-content"></div>
        </div>
        <!-- 부저만 사용 화면 -->
        <div id="screen-buzzer" class="screen">
            <button class="btn-float-back back-to-lobby host-only">◁</button>
            <h2 style="font-size:1.15rem; margin-bottom:10px;">🚨 부저만 사용</h2>
            <div id="buzzer-content"></div>
        </div>
    </div>

    <!-- The main logic is loaded after the body and firebase -->
    <script src="mafia.js"></script>
    <script src="liar.js"></script>
    <script src="quiz_db.js"></script>
    <script src="quiz.js"></script>
    <script src="minigames.js"></script>
    <script src="record.js"></script>
    <script src="buzzer.js"></script>
    <script type="module" src="app.js"></script>
    
</body>
</html>
